apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: monitoring
  labels:
    app: k8s-mcp-server
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-mcp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: k8s-mcp-server
        image: ghcr.io/kijoyin/k8s-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Prometheus__Url
          value: "http://prometheus.monitoring:9090"
        - name: Mcp__RequireAuth
          value: "true"
        - name: McpAuth__ApiKey
          valueFrom:
            secretKeyRef:
              name: k8s-mcp-server-secrets
              key: api-key
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10